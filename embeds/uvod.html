<iframe src="https://jeschkelukas.github.io/hc-lany/prehled/" width="100%" height="670" scrolling="no" style="border:0;overflow:hidden;display:block;margin-top:8px" title="HC Lány – přehled"></iframe>
<script>
window.addEventListener("message", function (e) {
  if (e.origin !== "https://jeschkelukas.github.io" || !e.data || typeof e.data.hcLanyHeight !== "number") return;
  var frames = document.querySelectorAll('iframe[src^="https://jeschkelukas.github.io/hc-lany/"]');
  for (var i = 0; i < frames.length; i++) {
    var f = frames[i];
    if (f.contentWindow !== e.source) continue;
    f.style.height = Math.max(200, Math.min(6000, e.data.hcLanyHeight)) + "px";
    e.source.postMessage({ hcLanyAuto: true }, e.origin);
    if (e.data.nav && f.getBoundingClientRect().top < 0) f.scrollIntoView();
  }
});
</script>
