name: Update stats

on:
  schedule:
    # Every half hour (GitHub may start scheduled runs a few minutes late).
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # ImageMagick shrinks player photos to thumbnails; the build still works without it.
      - run: sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    needs: deploy
    runs-on: ubuntu-latest
    # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling
    # resets that timer. It runs after the deploy and may fail without affecting the widgets.
    continue-on-error: true
    steps:
      - run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
